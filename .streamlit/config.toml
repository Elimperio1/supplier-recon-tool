# Native-widget theme. The CSS layer in app.py refines everything on top of this;
# these tokens make Streamlit's own widgets (inputs, tables, alerts) match.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"

[client]
showErrorDetails = true
toolbarMode = "minimal"
